<svg xmlns="http://www.w3.org/2000/svg" width="960" height="311" viewBox="0 0 960 311" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8962e"/></marker></defs>
<rect width="960" height="311" rx="14" fill="#ffffff"/>
<text x="32" y="38" font-size="18" font-weight="700" fill="#1d2733">Person and vehicle detection in thermal UAV imagery</text>
<text x="32" y="60" font-size="12.5" fill="#5b6775">How much does a visible-light detector lose on infrared images, and how much does fine-tuning recover?</text>
<g transform="translate(32.0,86)">
<rect width="198.5" height="201" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">1 · DATA</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">HIT-UAV</text>
<text x="14" y="70" font-size="11" fill="#5b6775">~2,900 infrared images</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Classes</text>
<text x="14" y="112" font-size="11" fill="#5b6775">person, car, bicycle,</text>
<text x="14" y="127" font-size="11" fill="#5b6775">other vehicle</text>
<text x="14" y="153" font-size="12.5" font-weight="700" fill="#1d2733">Day and night</text>
<text x="14" y="169" font-size="11" fill="#5b6775">various altitudes and angles</text>
</g>
<line x1="234.5" y1="186" x2="260.5" y2="186" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(264.5,86)">
<rect width="198.5" height="201" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">2 · PREPARATION</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Dataset checks</text>
<text x="14" y="70" font-size="11" fill="#5b6775">structure, class counts</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Thermal augmentation</text>
<text x="14" y="112" font-size="11" fill="#5b6775">no colour jitter,</text>
<text x="14" y="127" font-size="11" fill="#5b6775">brightness only</text>
</g>
<line x1="467.0" y1="186" x2="493.0" y2="186" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(497.0,86)">
<rect width="198.5" height="201" rx="10" fill="#2c5578"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#f0d79e" letter-spacing=".6">3 · MODELS</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#ffffff">(a) Visible-light YOLO</text>
<text x="14" y="70" font-size="11" fill="#d7e3ee">COCO-pretrained, zero-shot</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#ffffff">(b) Thermal YOLO</text>
<text x="14" y="112" font-size="11" fill="#d7e3ee">fine-tuned on HIT-UAV</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#ffffff">Same test images</text>
<text x="14" y="154" font-size="11" fill="#d7e3ee">for both models</text>
</g>
<line x1="699.5" y1="186" x2="725.5" y2="186" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(729.5,86)">
<rect width="198.5" height="201" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">4 · EVALUATION</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Per-class precision / recall</text>
<text x="14" y="70" font-size="11" fill="#5b6775">for both models</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Domain gap</text>
<text x="14" y="112" font-size="11" fill="#5b6775">visible-light vs thermal</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#1d2733">Class mapping</text>
<text x="14" y="154" font-size="11" fill="#5b6775">COCO classes → HIT-UAV classes</text>
</g>
</svg>
