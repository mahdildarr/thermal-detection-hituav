[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thermaldet"
version = "0.2.0"
description = "Person and vehicle detection in thermal UAV imagery (HIT-UAV): visible-to-thermal domain gap and error analysis by capture condition."
authors = [{ name = "Şule Özdamar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0", "opencv-python", "numpy", "pandas", "matplotlib", "pyyaml", "pycocotools",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
